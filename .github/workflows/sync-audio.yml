name: Sync Audio to Playlists

on:
  push:
    branches: [main]
    paths:
      - 'assets/audio/produced/**'
      - 'assets/audio/favorites/**'

concurrency:
  group: sync-audio
  cancel-in-progress: false

jobs:
  sync-audio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run audio sync script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Always sync from the true latest state of main before computing
          git fetch origin main
          git reset --hard origin/main
          node scripts/sync-audio.js

      - name: Commit updated playlists if changed
        run: |
          git add assets/songs/schedule.json assets/songs/produced.json
          if git diff --cached --quiet; then
            echo "No playlist changes detected, skipping commit."
          else
            # No [skip ci] marker here on purpose. vercel.json's ignoreCommand
            # cancels the build for any commit carrying it, which meant the
            # commit that actually registered a new track never deployed — the
            # mp3 went live while the playlist referencing it did not.
            # This commit only touches assets/songs/*.json and the workflow
            # triggers only on assets/audio/**, so it cannot re-trigger itself.
            git commit -m "chore: auto-register new audio files"
            git push origin main
          fi
